<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080918">
  <meta name="description" content="TeslAI: experiencia galáctica para aprender física e inteligencia artificial aplicada al tráfico mediante globos de diálogo interactivos.">
  <title>TeslAI 3.0 · Física e IA en movimiento</title>
  <link rel="stylesheet" href="styles.css?v=14">
  <link rel="stylesheet" href="welcome.css?v=6">
</head>
<body data-idle-image="images/teslai-idle.png" data-talk-image="images/teslai-talking.png">
  <div class="universe" aria-hidden="true"><div class="nebula nebula-blue"></div><div class="nebula nebula-violet"></div><div class="nebula nebula-pink"></div><div class="starfield"></div><div class="particles"></div></div>
  <section class="welcome-screen" id="welcome-screen" aria-label="Inicio de TeslAI">
    <div class="welcome-top"><span class="brand-spark">T<span>✳</span></span><span>TESLAI · UNIVERSO DE APRENDIZAJE</span></div>
    <div class="welcome-stage">
      <button class="welcome-character" id="welcome-character" aria-label="Iniciar recorrido con TeslAI"><img id="welcome-image" src="images/teslai-idle.png" alt="TeslAI en reposo"></button>

      <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
    </div>
    <div class="welcome-title"><h1>TeslAI</h1><button type="button" class="welcome-continue" id="welcome-continue">Clic para continuar...</button><div class="authors"><span>JOAN D</span><i>·</i><span>YABIN B.</span></div></div>
  </section>
  <div class="app" id="app" hidden>
    <header class="world-header"><button class="brand-cloud cloud-small" data-action="menu" aria-label="Volver al menú principal">T ✳ <span>TESLAI</span></button><button class="progress-cloud cloud-small" id="progress-cloud" aria-label="Progreso de aprendizaje">RUTA · 0/7</button><button class="home-cloud cloud-small" data-action="welcome" aria-label="Volver a la pantalla inicial">INICIO</button></header>
    <main class="learning-world" id="learning-world">
      <section class="talk-space" aria-label="Conversación educativa con TeslAI">
        <div class="character-anchor" id="character-anchor"><button class="character-button" id="character-button" aria-label="TeslAI, toca para escuchar"><img id="character-image" src="images/teslai-idle.png" alt="TeslAI en reposo"></button><span class="character-name">TESLAI</span></div>
        <div class="main-cloud cloud" id="main-cloud" tabindex="0" aria-live="polite" aria-label="Globo de diálogo de TeslAI">
          <div class="cloud-copy" id="cloud-copy">
            <span class="cloud-kicker" id="cloud-kicker">TESLAI · EXPLORACIÓN</span>
            <h2 id="cloud-title">Un universo por descubrir</h2>
            <div class="cloud-message" id="cloud-message"></div>
            <div class="cloud-extras" id="cloud-extras"></div>
            <button class="advance-prompt" id="advance-prompt" type="button" hidden>Clic para avanzar...</button>
          </div>
        </div>
      </section>
      <section class="simulation-space" id="simulation-space" aria-label="Escenario interactivo" hidden><canvas id="simulation-canvas" aria-label="Visualización de la simulación"></canvas><canvas id="chart-canvas" aria-label="Gráfica de flujo vehicular" hidden></canvas></section>
      <section class="control-clouds" id="control-clouds" aria-label="Controles presentados por TeslAI" hidden></section>
      <section class="option-clouds" id="option-clouds" aria-label="Opciones de diálogo con TeslAI"></section>
      <nav class="cloud-navigation" id="cloud-navigation" aria-label="Navegación con TeslAI"></nav>
    </main>
    <footer class="world-footer"><span>Una experiencia didáctica · Simulaciones simplificadas, no aptas para control vial real.</span><button class="reset-cloud cloud-small" id="reset-progress" type="button">REINICIAR PROGRESO</button></footer>
  </div>
  <script src="curriculum.js?v=5"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
